{{ define "main" }}
  <article>
    <h1>{{ .Title }}</h1>
    {{ if .Date }}<p class="post-date">{{ .Date.Format "January 2, 2006" }}</p>{{ end }}
    {{ .Content }}
    {{ with .GetTerms "tags" }}
      <p class="tag-list">
        {{ range . }}<a class="tag" href="{{ .RelPermalink }}">#{{ .LinkTitle }}</a>{{ end }}
      </p>
    {{ end }}
  </article>
  {{ if in (slice "posts") .Type }}
    {{ partial "giscus.html" . }}
  {{ end }}
{{ end }}
