{{ define "main" }}
  <h1>{{ .Site.Title }}: a range of high alpine mountains </h1>
  {{ .Content }}

  <ul class="post-list">
    {{ range first 10 (where .Site.RegularPages "Type" "posts") }}
      <li>
        <a href="{{ .RelPermalink }}">{{ .Title }}</a>
        <span class="post-date">{{ .Date.Format "Jan 2, 2006" }}</span>
      </li>
    {{ end }}
  </ul>
{{ end }}
